events {}

http {
    server {
        listen 443 ssl;
        
        ssl_certificate /etc/letsencrypt/live/sunt.software/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sunt.software/privkey.pem;

	location /dns-query {
 	    proxy_pass http://127.0.0.1:8080/dns-query;
        }

        location /resolve {
            proxy_pass http://127.0.0.1:8080/resolve;
        }
    }
}
